<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f7f2">
  <meta name="description" content="三阶段看房指导、房源记录与多套房对比。把每套房，看明白。">
  <title>看房手记 · 把每套房看明白</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./app.css">
  <script src="./config.js"></script>
  <script type="module" src="./app.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#guide" aria-label="看房手记首页"><span class="brand-mark" aria-hidden="true">⌂</span><span>看房手记<small>RENTAL NOTES</small></span></a>
    <nav class="main-nav" aria-label="主要导航">
      <a href="#guide" data-view="guide">看房指导</a>
      <a href="#homes" data-view="homes">我的房源 <span id="home-count">0</span></a>
      <a href="#compare" data-view="compare">房源对比 <span id="compare-count">0</span></a>
    </nav>
    <button class="storage-button" id="storage-button" aria-label="数据与同步"><span class="status-dot"></span><span id="storage-label">保存在此设备</span><span aria-hidden="true">↗</span></button>
  </header>
  <main id="app" tabindex="-1"></main>
  <footer class="site-footer"><span>看房有章法，选择有依据。</span><span>你的标准 · 你的记录 · 你的选择</span></footer>
  <dialog id="editor" class="editor-dialog" aria-labelledby="editor-title"></dialog>
  <dialog id="settings" class="settings-dialog" aria-labelledby="settings-title"></dialog>
  <dialog id="confirm-dialog" class="confirm-dialog" aria-labelledby="confirm-title"></dialog>
  <input id="import-file" type="file" accept="application/json,.json" hidden>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <noscript>请启用 JavaScript，以使用房源记录和对比功能。</noscript>
</body>
</html>
