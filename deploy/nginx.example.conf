# After the public address, TLS certificate and cloud access requirements are
# resolved, adapt this as a NEW site. Replace all three placeholders first.
server {
    listen 443 ssl;
    server_name YOUR_PUBLIC_HOST;
    ssl_certificate /YOUR/CERTIFICATE/fullchain.pem;
    ssl_certificate_key /YOUR/CERTIFICATE/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 256k;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    location / {
        proxy_pass http://127.0.0.1:8877;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 35s;
    }
}
